[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llminfra"
version = "1.0.0"
description = "Educational PyTorch implementations of modern LLM building blocks"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["llm", "attention", "flashattention", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "jianzhnie", email = "jianzhnie@gmail.com" },
]
dependencies = [
    "torch"
]

[project.urls]
Homepage = "https://github.com/jianzhnie/LLMInfra"
Repository = "https://github.com/jianzhnie/LLMInfra"
Issues = "https://github.com/jianzhnie/LLMInfra/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["llminfra*"]

[tool.setuptools.package-data]
llminfra = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # Pycodestyle errors
    "W",     # Pycodestyle warnings
    "I",     # Isort
    "B",     # Flake8-bugbear
    "C4",    # Flake8-comprehensions
    "SIM",   # Flake8-simplify
    "UP",    # Pyupgrade
    "RUF",   # Ruff-specific rules
]
ignore = [
    # Classes are documented in the class docstring (Google style), not in
    # `__init__`; pydocstyle recommends disabling D107 for that convention.
    "D107",
    # Incompatible-rule pairs: keep the ruff defaults (D211, D212) explicit.
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Test functions need neither annotations nor docstrings.
"tests/**" = ["ANN", "D"]

[tool.ruff.lint.isort]
known-first-party = ["llminfra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.coverage.run]
source = ["llminfra"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "def extra_repr",
    "raise NotImplementedError",
    "return NotImplemented",
    "\\.\\.\\.",
]
